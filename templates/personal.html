<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerCompass AI - Your Details</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #0d0b1a;
    color: #ffffff;
  }

  a {
    text-decoration: none;
    color: inherit;
  }

  /* NAVBAR */
  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 50px;
    border-bottom: 1px solid #22203a;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
  }

  .logo-text h1 {
    font-size: 22px;
    color: #ffffff;
  }

  .logo-text h1 span {
    color: #8b5cf6;
  }

  .logo-text p {
    font-size: 12px;
    color: #9691b0;
  }

  .lang-select {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: #cfcbe0;
    cursor: pointer;
  }
  .page-wrapper {
  display: flex;
  justify-content: center;
  padding: 50px 20px;
}
 
/* FORM CARD */
.form-card {
  background-color: #14101f;
  border: 1px solid #2a2540;
  border-radius: 14px;
  padding: 40px;
  width: 100%;
  max-width: 550px;
}
 
.step-tag {
  display: inline-block;
  background-color: #2c1c4d;
  color: #a855f7;
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 20px;
  margin-bottom: 15px;
}
 
.form-card h2 {
  font-size: 24px;
  margin-bottom: 8px;
}
 
.subtitle {
  color: #a29dbd;
  font-size: 14px;
  margin-bottom: 30px;
}
 
/* FORM ELEMENTS */
.form-group {
  margin-bottom: 20px;
}
 
.form-group label {
  display: block;
  font-size: 13px;
  color: #cfcbe0;
  margin-bottom: 8px;
}
 
.form-group input,
.form-group select {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #322c4d;
  background-color: #1b1730;
  color: #ffffff;
  font-size: 14px;
}
 
.form-group input::placeholder {
  color: #7a7492;
}
 
.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: #8b5cf6;
}
 
.form-group select {
  cursor: pointer;
}
 
.row {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
}
 
.row .half {
  flex: 1 1 200px;
}
 
/* BUTTON */
.next-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background-color: #7c3aed;
  background-image: linear-gradient(to right, #7c3aed, #3b82f6);
  color: #ffffff;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}
 
.next-btn:hover {
  opacity: 0.9;
}
 
/* FOOTER */
.footer {
  border-top: 1px solid #22203a;
  padding: 20px 50px;
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  justify-content: space-between;
  color: #8a84a0;
  font-size: 13px;
}
 
.footer div {
  display: flex;
  align-items: center;
  gap: 6px;
}
 
@media (max-width: 700px) {
  .navbar, .footer {
    padding-left: 20px;
    padding-right: 20px;
  }
 
  .form-card {
    padding: 25px;
  }}
  </style>
</head>
<body>

  <!-- NAVBAR -->
   <div class="navbar">
    <div class="logo-area">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" stroke="#8b5cf6" stroke-width="2"/>
        <path d="M15 9L13 13L9 15L11 11L15 9Z" fill="#8b5cf6"/>
      </svg>
      <div class="logo-text">
        <h1>CareerCompass <span>AI</span></h1>
        <p>Discover. Assess. Achieve.</p>
      </div>
    </div>
    <div class="lang-select">
      🌐 English 
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="page-wrapper">

    <div class="form-card">

      <div class="step-tag">Step 1 of 6</div>
      <h2>Tell Us About Yourself</h2>
      <p class="subtitle">This helps us personalize your career assessment.</p>

      <form id="detailsForm" action="/personal" method="POST">

        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        </div>

        <div class="row">
          <div class="form-group half">
            <label for="age">Age</label>
            <input type="number" id="age" name="age"placeholder="Enter your age" min="10" max="100" required>
          </div>

          <div class="form-group half">
            <label for="education">Current Education</label>
            <select id="education" name="education" required>
              <option value="" disabled selected>Select</option>
              <option value="10th">10th</option>
              <option value="12th">12th</option>
              <option value="BE/BTech">BE / BTech</option>
              <option value="BSc">BSc</option>
              <option value="BCA">BCA</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="otherEdu">If Other, please specify</label>
          <input type="text" id="otherEdu" name="otherEdu" placeholder="Mention your course/education (only if you selected Other)">
        </div>

        <div class="form-group">
          <label for="cgpa">CGPA / Percentage</label>
          <input type="text" id="cgpa" name="cgpa" placeholder="e.g. 8.5 CGPA or 85%" required>
        </div>

        <div class="row">
          <div class="form-group half">
            <label for="state">State</label>
            <input type="text" id="state" name="state" placeholder="Enter your state" required>
          </div>

          <div class="form-group half">
            <label for="district">District</label>
            <input type="text" id="district" name="district" placeholder="Enter your district" required>
          </div>
        </div>

    <button type="submit" class="next-btn">
        Next →
    </button>

      </form>

    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div>🛡️ Your data is safe with us. We respect your privacy.</div>
    <div>✉️ support@careercompass.ai</div>
    <div>❤️ Helping students build a better tomorrow.</div>
  </div>


</body>
</html>
